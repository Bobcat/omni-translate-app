  <meta charset="utf-8">

  <meta name="theme-color" content="#fcfaf5">
  <title>Omni Translate</title>
  <script>
    // Resolve Appearance and sidebar state before first paint. Keep the
    // appearance key/defaults in sync with mobile and shared/appearance.js.
    (function () {
      document.documentElement.classList.add('shell-booting');
      var shell = null;
      var appearance = null;
      try { shell = JSON.parse(window.localStorage.getItem('omni-translate.desktop.shell') || 'null'); } catch (e) {}
      try { appearance = JSON.parse(window.localStorage.getItem('appearance_settings') || 'null'); } catch (e) {}
      var theme = appearance && (appearance.theme === 'system' || appearance.theme === 'light' || appearance.theme === 'dark')
        ? appearance.theme
        : 'system';
      var palette = appearance && (appearance.palette === 'warm' || appearance.palette === 'cool')
        ? appearance.palette
        : 'warm';
      var dark = theme === 'dark'
        || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var effectiveTheme = dark ? 'dark' : 'light';
      window.__OMNI_DESKTOP_INITIAL_SHELL__ = {
        sidebarOpen: shell && typeof shell.sidebarOpen === 'boolean' ? shell.sidebarOpen : true,
      };
      document.documentElement.dataset.theme = effectiveTheme;
      document.documentElement.dataset.palette = palette;
      var colors = {
        'light-warm': '#fcfaf5',
        'light-cool': '#f5f7fa',
        'dark-warm': '#161513',
        'dark-cool': '#0e1117',
      };
      document.documentElement.style.background = colors[effectiveTheme + '-' + palette];
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = colors[effectiveTheme + '-' + palette];
    }());
  </script>
  <style>
    .shell-booting .app-container { visibility: hidden; }
  </style>
  <link rel="stylesheet" href="../foundation/spa-foundation/css/base.css">
  <link rel="stylesheet" href="../foundation/spa-foundation/css/shell.css">
  <!-- The foundation still supplies separate structural light/dark presets;
       Appearance chooses the matching href before first paint. -->
  <link
    rel="stylesheet"
    id="presetStylesheet"
    data-modern-href="../foundation/spa-foundation/css/preset-modern.css"
    data-dark-href="../foundation/spa-foundation/css/preset-dark.css"
  >
  <script>
    (function () {
      var presetStylesheet = document.getElementById('presetStylesheet');
      presetStylesheet.href = document.documentElement.dataset.theme === 'dark'
        ? presetStylesheet.dataset.darkHref
        : presetStylesheet.dataset.modernHref;
      // Lift the boot curtain only once the preset stylesheet is really
      // loaded: it defines every color variable, so painting earlier looks
      // unstyled on slow connections. window load is the fallback so the
      // curtain can never stick.
      var lifted = false;
      var lift = function () {
        if (lifted) return;
        lifted = true;
        document.documentElement.style.background = '';
        document.documentElement.classList.remove('shell-booting');
      };
      presetStylesheet.addEventListener('load', lift);
      window.addEventListener('load', lift);
    }());
  </script>

  <script>
    // Apply the persisted sidebar state pre-paint. The boot curtain is
    // lifted by the preset stylesheet's load handler in the head.
    (function () {
      var initial = window.__OMNI_DESKTOP_INITIAL_SHELL__ || { sidebarOpen: true };
      var sidebar = document.getElementById('sidebar');
      if (sidebar) {
        sidebar.classList.toggle('expanded', !!initial.sidebarOpen);
      }
    }());
  </script>
